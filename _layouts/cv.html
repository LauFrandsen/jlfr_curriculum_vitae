<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.title }}">
  <meta name="author" content="Jonas Lau Frandsen">

  <!-- PDF Metadata -->
  <meta name="pdf:Title" content="{{ page.title }}">
  <meta name="pdf:Author" content="Jonas Lau Frandsen">
  <meta name="pdf:Subject" content="Curriculum Vitae">

  <title>{% if page.title %}{{ page.title }} | {% endif %}CV</title>

  <!-- Apply dark mode immediately to prevent flash (only if explicitly set) -->
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>

  <!-- Fonts: Inter 300/400/500 + JetBrains Mono 400/500 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link href="{{ site.baseurl }}/media/{{ site.style }}-screen.css?v=1" type="text/css" rel="stylesheet" media="screen">
  <link href="{{ site.baseurl }}/media/{{ site.style }}-print.css?v=1" type="text/css" rel="stylesheet" media="print">
</head>
<body>

  <!-- Controls -->
  <div class="controls screen-only">
    <button class="control-btn" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
      <span class="theme-icon-light">Dark</span>
      <span class="theme-icon-dark">Light</span>
    </button>
    <button class="control-btn" id="printBtn" title="Print / Save as PDF" aria-label="Print CV">Print</button>
  </div>

  <main id="content">
    {{ content }}

    <footer class="site-footer screen-only">
      <div class="footer-wordmark" aria-hidden="true">jonas lau frandsen</div>
      <p class="footer-meta">CV last updated June 2026 &middot; <a href="https://github.com/LauFrandsen/jlfr_curriculum_vitae">Built with Jekyll</a></p>
    </footer>
  </main>

  <script>
    // Theme toggle — token swap via .dark on <html>
    document.getElementById('themeToggle').addEventListener('click', function () {
      const root = document.documentElement;
      root.classList.toggle('dark');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    });

    // Print — expand collapsed sections first so nothing is lost on paper
    function expandForPrint() {
      document.querySelectorAll('details').forEach(d => { d.open = true; });
    }
    window.addEventListener('beforeprint', expandForPrint);
    document.getElementById('printBtn').addEventListener('click', function () {
      expandForPrint();
      window.print();
    });
  </script>
</body>
</html>
